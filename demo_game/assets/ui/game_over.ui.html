<link rel="stylesheet" href="assets/ui/theme.css">
<style>
  #stats { margin-top: 28px; width: 320px; display: flex; flex-direction: column; gap: 14px; }
  #record { margin-top: 18px; font-size: 16px; color: #ffd34d; text-shadow: 2px 2px #b03a2e; }
  .menu { margin-top: 26px; width: 300px; }
</style>
<div class="screen">
  <div class="heading" style="font-size: 32px; color: #ff6b5a; text-shadow: 4px 4px #3a0a08">GAME OVER</div>
  <div id="subtitle" class="subheading">SHOT DOWN OVER THE PACIFIC</div>
  <div id="stats" class="panel">
    <div class="row"><span class="label">SCORE</span><span id="score" class="value">0000000</span></div>
    <div class="row"><span class="label">HI-SCORE</span><span id="hiscore" class="value gold">0000000</span></div>
  </div>
  <div id="record" class="hidden">NEW HIGH SCORE!</div>
  <div class="menu panel">
    <div id="g-retry" class="item selected">CONTINUE</div>
    <div id="g-menu" class="item">MAIN MENU</div>
  </div>
  <div class="hint" style="margin-top: 14px">CONTINUING RESETS YOUR SCORE</div>
</div>
