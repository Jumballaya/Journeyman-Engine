<link rel="stylesheet" href="assets/ui/theme.css">
<style>
  #stats { margin-top: 28px; width: 360px; display: flex; flex-direction: column; gap: 14px; }
  #stats .value { font-size: 16px; }
  #prompt { margin-top: 32px; }
</style>
<div class="screen">
  <div id="title" class="heading">STAGE 1<br>CLEAR!</div>
  <div id="subtitle" class="subheading">PACIFIC DAWN</div>
  <div id="stats" class="panel">
    <div class="row"><span class="label">ENEMIES DOWN</span><span id="kills" class="value">0</span></div>
    <div class="row"><span class="label">ACCURACY</span><span id="accuracy" class="value">0%</span></div>
    <div class="row"><span class="label">ACCURACY BONUS</span><span id="bonus" class="value gold">0</span></div>
    <div class="row"><span class="label">NO-MISS BONUS</span><span id="nomiss" class="value gold">0</span></div>
    <div class="row"><span class="label">SCORE</span><span id="score" class="value">0000000</span></div>
  </div>
  <div id="prompt" class="hint hidden">PRESS ENTER TO CONTINUE</div>
</div>
