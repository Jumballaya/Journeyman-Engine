<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journeyman Studio</title>
<style>
  /* Our colors, under the host's where it gives them (MCP Apps style variables). */
  :root {
    --jm-bg: #ffffff; --jm-panel: #f6f6f7; --jm-raised: #ececef; --jm-line: #e3e3e6; --jm-text: #18181b; --jm-muted: #6b6b75;
    --jm-accent: #e8590c; --jm-accent-soft: #fff1e8; --jm-warn: #c92a2a; --jm-on-accent: #fff; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --jm-bg: #18181b; --jm-panel: #222226; --jm-raised: #2c2c31; --jm-line: #34343a; --jm-text: #ececf0; --jm-muted: #9a9aa5;
    --jm-accent: #ff8a3d; --jm-accent-soft: #3a2416; --jm-warn: #ff6b6b; --jm-on-accent: #1a1a1a; color-scheme: dark;
  }
  :root {
    --bg: var(--color-background-primary, var(--jm-bg)); --panel: var(--color-background-secondary, var(--jm-panel));
    --raised: var(--color-background-tertiary, var(--jm-raised)); --line: var(--color-border-primary, var(--jm-line));
    --text: var(--color-text-primary, var(--jm-text)); --muted: var(--color-text-secondary, var(--jm-muted));
    --warn: var(--color-text-danger, var(--jm-warn)); --accent: var(--jm-accent); --accent-soft: var(--jm-accent-soft);
    --radius: var(--border-radius-md, 8px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: var(--font-text-sm-size, 13px)/1.45 var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif); }
  body { padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
  button, input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 10px; min-height: 28px; }
  input::placeholder { color: var(--muted); }
  button { cursor: pointer; font-weight: 500; white-space: nowrap; } button:hover:not(:disabled) { background: var(--panel); border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--jm-on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The page: a side bar (the game, then the tabs by group) beside the view; a bar on top when narrow or inline. */
  .studio { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 100vh; }
  .studio > :only-child { grid-column: 1 / -1; }  /* loading, or a confirm: no side bar */
  .side { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; background: var(--panel); border-right: 1px solid var(--line);
    position: sticky; top: 0; height: 100vh; overflow-y: auto; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 10px; min-width: 0; }
  .mark { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .game-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { flex-wrap: wrap; row-gap: 4px; } .brand .game-name { flex: 1 0 calc(100% - 26px); } .brand .badge { margin-left: 26px; }  /* a variant's name: under the game's */
  :root[data-bar="top"] .brand { flex-wrap: nowrap; } :root[data-bar="top"] .brand .game-name { flex: 0 1 auto; } :root[data-bar="top"] .brand .badge { margin-left: 0; }
  .tabs { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .group { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 10px 4px; }
  .tab { display: flex; align-items: center; gap: 9px; border: 0; background: none; border-radius: 7px; padding: 5px 10px; min-height: 30px;
    color: var(--muted); text-align: left; font-weight: 500; }
  .tab svg { width: 16px; height: 16px; flex: none; }
  .tab:hover:not(:disabled) { background: var(--raised); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tab:disabled { opacity: .45; }
  .status { margin-top: auto; padding: 10px 8px 2px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .status:empty { display: none; }
  /* Inline, or narrow (kit.theme sets data-bar): one row of icons on top, the shown tab named. */
  :root[data-bar="top"] .studio { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  :root[data-bar="top"] .side { flex-direction: row; align-items: center; height: auto; padding: 4px 8px; border-right: 0;
    border-bottom: 1px solid var(--line); overflow: visible; z-index: 2; }
  :root[data-bar="top"] .brand { padding: 0 8px 0 2px; max-width: 30%; }
  :root[data-bar="top"] .tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; flex: 1; }
  :root[data-bar="top"] .group, :root[data-bar="top"] .tab:not([aria-selected="true"]) .tab-label { display: none; }
  :root[data-bar="top"] .tab { padding: 5px 8px; gap: 6px; }
  :root[data-bar="top"] .status { margin: 0 0 0 auto; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
  :root[data-mode="inline"] .studio { min-height: 0; }
  :root[data-bar="none"] .studio { grid-template-columns: minmax(0, 1fr); min-height: 0; } :root[data-bar="none"] .side { display: none; }
  :root[data-mode="pip"] .view { padding: 8px; }
  .pipbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 0; }
  .copybar { display: flex; align-items: center; gap: 8px; margin: 12px 22px 0; padding: 6px 8px 6px 12px; border-radius: 10px;
    background: var(--accent-soft); color: var(--text); } .copybar svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  :root[data-bar="top"] .copybar { margin: 10px 16px 0; }
  .update { margin: 12px 20px 0; padding: 8px 12px; border-radius: var(--radius); background: var(--accent-soft); color: var(--text); }
  .main { min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; padding: 18px 22px 24px; min-width: 0; }
  :root[data-mode="inline"] .view { max-height: 560px; overflow: auto; padding: 14px 16px; }
  /* Fullscreen, ChatGPT floats its composer over the page's foot (safe area or not): room to scroll past it. */
  :root[data-mode="fullscreen"] .view { padding-bottom: max(140px, var(--safe-bottom)); }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .head input { flex: 1; min-width: 160px; }
  .spacer { flex: 1; } .meta { color: var(--muted); }
  .empty { color: var(--muted); padding: 28px 16px; text-align: center; display: grid; gap: 10px; justify-items: center;
    border: 1px dashed var(--line); border-radius: 12px; }
  .section { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
  div:not(.grid):not(.pane):not(.tasks-board) > .section + .section { margin-top: 12px; }  /* stacked; a grid's gap spaces its own */
  .section h2 { font-size: 12px; font-weight: 600; color: var(--text); margin: 0 4px 8px; display: flex; gap: 6px; align-items: baseline; }
  .section > .meta { padding: 2px 4px; }
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-bottom: 16px; }
  .moment-picture { width: 100%; border-radius: var(--radius); image-rendering: pixelated; display: block; margin: 6px 0; }
  .moment-picks { margin: 0 0 8px; padding-left: 20px; font-size: 12px; }
  .hero-thumb { width: 152px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; image-rendering: pixelated; display: block; border: 1px solid var(--line); }
  .hero-text { display: grid; gap: 4px; min-width: 0; }
  .hero-text .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hero.bare { grid-template-columns: minmax(0, 1fr) auto; }  /* no picture: the text shrinks before the actions do */
  @media (max-width: 640px) { .hero { grid-template-columns: auto minmax(0, 1fr); } .hero.bare { grid-template-columns: minmax(0, 1fr); } .hero-actions { grid-column: 1 / -1; justify-content: flex-start; } }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; display: grid; min-width: 96px; }
  .stat b { font-size: 18px; font-weight: 650; } .stat span { color: var(--muted); font-size: 12px; }
  .form { display: grid; gap: 6px; }
  .field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px; align-items: center; }
  .field label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field input, .field select { min-width: 0; width: 100%; padding: 2px 6px; background: var(--bg); }
  .field .vals { display: flex; gap: 4px; min-width: 0; align-items: center; }
  .field .vals button { padding: 1px 7px; }
  .tree { display: grid; }
  .tree .row { display: flex; gap: 4px; align-items: baseline; border: 0; background: none; text-align: left; padding: 3px 6px;
    border-radius: 6px; min-width: 0; }
  .tree .row:hover { background: var(--panel); }
  .tree .row.on { background: var(--accent-soft); color: var(--accent); }
  .tree .twisty { width: 14px; height: 14px; flex: none; color: var(--muted); align-self: center; display: grid; place-items: center; }
  .tree .twisty svg { width: 12px; height: 12px; transition: transform .12s; } .tree .twisty.open svg { transform: rotate(90deg); }
  .nothumb { display: grid; place-items: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); }
  .nothumb svg { width: 16px; height: 16px; opacity: .8; }
  .tree .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree .meta { margin-left: auto; padding-left: 8px; font-size: 11px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--bg); border: 1px solid var(--line); box-shadow: 0 0 0 1px transparent; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--muted); } .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); } .badge.warn { color: var(--warn); }
  .card .pick { all: unset; display: flex; flex-direction: column; cursor: pointer; }
  .card .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
  .thumb { aspect-ratio: 16 / 9; background: var(--raised); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
  .thumb .letter { font-size: 40px; font-weight: 700; color: var(--muted); opacity: .6; }
  .card-body { padding: 10px 12px 12px; display: grid; gap: 2px; }
  .name { font-weight: 650; font-size: 14px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); flex: none; font-weight: 500; }
  .badge.idle { background: var(--raised); color: var(--muted); }
  .dense .grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .dense .thumb img { object-fit: contain; }
  .dense .name { font-size: 12px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 10px; }
  .split { display: grid; grid-template-columns: minmax(0, var(--split)) 6px minmax(0, 1fr); gap: 4px; align-items: start; }
  .split-bar { align-self: stretch; cursor: col-resize; border-radius: 3px; min-height: 40px; }
  .split-bar:hover, .split-bar:focus-visible { background: var(--line); }
  .pane { min-width: 0; display: grid; gap: 10px; }
  @media (max-width: 700px) { .split { grid-template-columns: 1fr; } .split-bar { display: none; } }
</style>
</head>
<body>
<div class="studio" id="app"><div class="empty">Opening Journeyman Studio…</div></div>
<script>/*__JM_BRIDGE__*/</script>
<script>
// Studio's tabs: each widget/studio/*.js pushes one here, as { id, title, order,
// home?, render(ctx) → element, background?(ctx) } (home: needs no game; background: on every page with a game).
const studioTabs = [];
</script>
<script>/*__JM_STUDIO__*/</script>
<script>
(() => {
  "use strict";
  const host = jmHost({ name: "journeyman-studio", version: "__JM_VERSION__", displayModes: ["fullscreen", "inline", "pip"] });
  const { el } = kit;
  const tabs = studioTabs.slice().sort((a, b) => a.order - b.order);
  const home = tabs.find((t) => t.home) || tabs[0];

  // route: the page shown, { tab, params } from an app-relative URL
  // ("/scene?scene=scenes/main.scene.json&entity=entities[2]"; "/" is home).
  // seen: the deep link and tool input (as JSON) routed to already, kept with
  // the route so a reopened Studio doesn't follow them again; call: the tool
  // input object followed; kept: what a reopened Studio had followed. refused:
  // the host said no to model context once (not asked again). want: a game a
  // route named, opened once the games are known. listed: a games answer asked
  // for after an action, over the host's answer it covers. visit: counts pages
  // shown and actions done (a tab asks for its data again on a new one). nav:
  // counts pages gone to only (a route's link is followed once per nav, not per action).
  const state = { route: null, seen: { link: null, input: null }, want: null, listed: null, notice: "", pending: null,
                  visit: 0, nav: 0, shared: "", sharing: false, refused: false, context: null, call: null, kept: null };

  const parse = (url) => {
    const [path, query = ""] = String(url || "/").split("?");
    const id = path.replace(/^\/+|\/+$/g, "");
    const tab = tabs.find((t) => t.id === id) || home;
    return { tab, params: Object.fromEntries(new URLSearchParams(query)) };
  };
  const format = ({ tab, params }) => {
    const query = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== undefined && v !== "")).toString();
    return (tab === home ? "/" : "/" + tab.id) + (query ? "?" + query : "");
  };

  // The games answer: { games, open, thumbs }, null while there's none.
  // Before jm answers, the games it gave last time (cached: true), kept in the
  // page's storage so the sidebar's Studio opens at once.
  const CACHE = "journeyman:studio:games:v1";
  const games = () => {
    const out = state.listed && state.listed.over === host.result ? state.listed.result : host.result;
    if (!out) return cached();
    const s = out.structuredContent;
    if (!s || !(Array.isArray(s.games) || s.games === null)) return null;
    const g = { games: (s.games || []).filter((g) => g && typeof g.path === "string"), open: s.open || "",
                thumbs: (out._meta && out._meta["jm/thumbs"]) || {} };
    if (state.stored !== out) {
      state.stored = out;
      try { localStorage.setItem(CACHE, JSON.stringify(g)); } catch (e) {}  // full, or no storage: next time opens empty
    }
    return g;
  };
  const cached = () => {
    try {
      const g = JSON.parse(localStorage.getItem(CACHE) || "null");
      return g && Array.isArray(g.games) ? { ...g, cached: true } : null;
    } catch (e) { return null; }
  };
  const said = (r) => (r && Array.isArray(r.content) ? r.content : []).filter((c) => c && c.type === "text").map((c) => c.text).join(" ");

  const refresh = async () => {
    const over = host.result;
    const listed = await host.callTool("games", {});
    if (listed && listed.structuredContent && Array.isArray(listed.structuredContent.games)) state.listed = { result: listed, over };
  };

  // Runs a tool for the person (the pages wait while it does), then lists the
  // games again; done(text) is what to say when it worked. True: it worked.
  const act = async (label, name, args, done) => {
    state.pending = label; state.notice = label + "…"; render();
    let ok = false;
    try {
      const r = await host.callTool(name, args);
      ok = !(r && r.isError);
      state.notice = ok ? done(said(r)) : `Couldn't: ${said(r) || "the call failed"}`;
      await refresh();
    } catch (e) { state.notice = "Couldn't: " + (e && e.message || e); }
    state.pending = null;
    state.visit++;
    render();
    return ok;
  };

  // Where the person goes: kept as the widget's state, so the host reopens it there.
  const go = (url) => {
    state.route = parse(url);
    state.visit++;
    state.nav++;
    host.setWidgetState({ ...(host.widgetState || {}), route: format(state.route), seen: state.seen });
    render();
  };

  // A route naming a game other than the open one opens it first (tools work on the open game).
  const follow = (url) => {
    state.want = parse(url).params.game || null;
    go(url);
  };
  const openWanted = (g) => {
    const want = state.want;
    if (!want || state.pending || g.cached) return;  // which game is open: jm's answer says, not the cache
    state.want = null;
    // Always opened, the open one too: the listing may be stale (another caller), and open_game resolves names as jm does.
    Promise.resolve().then(() => act("Opening the game", "open_game", { game: want }, () => ""));
  };
  const routeFromHost = () => {
    if (!state.route && !state.kept) {  // what it followed before it was closed (before go saves anew)
      state.kept = (host.widgetState && host.widgetState.seen) || {};
      state.seen = { link: state.kept.link || null, input: state.kept.input || null };  // saved again with the route
    }
    const kept = state.kept || {};
    const link = host.deepLink, input = host.input;
    if (link && link !== state.seen.link) { state.seen.link = link; follow(link); return true; }
    // A call's page: studio's route, or file_view's file (a host's, or a path).
    const page = !input ? null : typeof input.route === "string" ? input.route
      : input.file || input.path ? "/file" + (typeof input.path === "string" ? "?path=" + encodeURIComponent(input.path) : "") : null;
    if (page && input !== state.call) {  // each call is a new input object; reopened, the first is the old call's
      const key = JSON.stringify(input), again = state.call === null && kept.input === key;
      state.call = input;
      state.seen.input = key;
      if (!again) { follow(page); return true; }
    }
    if (!state.route) {
      const route = host.widgetState && host.widgetState.route;
      if (route) { follow(route); return true; }  // its game opened first
      const g = games();
      if (!g) return false;
      state.route = parse(g.open ? "/" + (tabs.find((t) => !t.home) || home).id : "/");
    }
    return false;
  };

  // The model's context: what the page shows (a tab may say more with ctx.share,
  // and attach what the person picked: a removable item in their chat).
  // One update at a time; the latest follows when it settles.
  const share = () => {
    const c = state.context;
    const key = JSON.stringify(c);
    if (state.sharing || state.refused || key === state.shared || !host.can("updateContext")) return;
    state.sharing = true;
    const content = [host.text(c.text, { hidden: true })];
    if (c.attach) content.unshift(host.text(c.attach.text, { title: c.attach.title, thumbnail: c.attach.thumb }));
    host.updateContext({ content, structuredContent: c.data })
      .then((taken) => { if (taken) state.shared = key; else state.refused = true; })
      .finally(() => { state.sharing = false; if (JSON.stringify(state.context) !== key) share(); });
  };

  // The side bar's groups, by tab id; a tab in none goes last. File shows while
  // it's the page, or with no game open (with one, Files opens files). Each tab's icon: 16px strokes.
  const groups = [["", ["games"]], ["Game", ["game", "play", "editor"]], ["Design", ["memory", "tasks"]],
                  ["Project", ["files", "file", "index", "git", "variants"]], ["Checks", ["health", "console"]]];
  const icons = { games: "M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z", game: "M2.5 7.5 8 2.5l5.5 5V13.5h-11z",
    play: "M5 3v10l8-5z", editor: "M2.5 13.5l.6-3L11 2.6l2.4 2.4-7.9 7.9zM9.5 4l2.4 2.4", memory: "M3 2.5h8a1.5 1.5 0 0 1 1.5 1.5v9.5H4.5A1.5 1.5 0 0 1 3 12zM3 12a1.5 1.5 0 0 1 1.5-1.5h8",
    tasks: "M2.5 4.2l1.2 1.2L6 3.1M8.5 4.5h5M2.5 10.2l1.2 1.2L6 9.1M8.5 10.5h5", files: "M2 4a1 1 0 0 1 1-1h3.5L8 4.5h5a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z",
    file: "M4 2h5l3 3v9H4zM9 2v3h3", index: "M5 2.5v11M11 2.5v11M2.5 5.5h11M2.5 10.5h11",
    git: "M5 2.5v11M11 7.5c0 2.5-6 1.5-6 4M12.5 6a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z", variants: "M8 2v4M8 6l-4.5 4v4M8 6l4.5 4v4",
    health: "M1.5 8.5h3l1.5-4 3 7 1.5-3h4", console: "M2 3h12v10H2zM4.5 6.3 6.5 8l-2 1.7M8 10h3.5" };
  const icon = (id) => el("svg:svg", { viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": "1.4", "stroke-linejoin": "round",
    "stroke-linecap": "round", "aria-hidden": "true" }, el("svg:path", { d: icons[id] || "M4 4h8v8H4z" }));
  // The tabs as the bar shows them; Alt+1..9 follow this order.
  const shown = (current, game) => {
    const listed = new Set(groups.flatMap(([, ids]) => ids));
    return [...groups.map(([name, ids]) => [name, ids.map((id) => tabs.find((t) => t.id === id)).filter(Boolean)]),
      ["More", tabs.filter((t) => !listed.has(t.id))]]
      .map(([name, list]) => [name, list.filter((t) => t.id !== "file" || t === current || !game)]).filter(([, list]) => list.length);
  };
  const tabBar = (current, game) => {
    const buttons = [];
    const kids = shown(current, game).flatMap(([name, list]) => [name ? el("div", { class: "group", "aria-hidden": "true" }, name) : null,
      list.map((t) => {
        const b = el("button", { class: "tab", role: "tab", "data-key": "tab:" + t.id,
          "aria-selected": t === current ? "true" : "false", disabled: !t.home && !game, title: t.title,
          onclick: () => open(t) }, icon(t.id), el("span", { class: "tab-label" }, t.title));
        buttons.push(b);
        return b;
      })]);
    const bar = el("div", { class: "tabs", role: "tablist", "aria-label": "Studio",
      "aria-orientation": document.documentElement.dataset.bar === "top" ? "horizontal" : "vertical" }, kids);
    buttons.forEach((b, i) => { if (i < 9) b.title += ` (${navigator.platform && /Mac/.test(navigator.platform) ? "⌥" : "Alt+"}${i + 1})`; });
    bar.addEventListener("keydown", (e) => {
      const live = buttons.filter((b) => !b.disabled), at = live.indexOf(e.target);
      const to = { ArrowLeft: at - 1, ArrowUp: at - 1, ArrowRight: at + 1, ArrowDown: at + 1, Home: 0, End: live.length - 1 }[e.key];
      if (to !== undefined && at >= 0) { e.preventDefault(); live[(to + live.length) % live.length].focus(); }
    });
    return bar;
  };
  // A tab opened by the person: inline, the Studio asks for the whole window.
  const open = (t) => {
    go(format({ tab: t, params: {} }));
    if (host.displayMode === "inline" && (host.displayModes || ["fullscreen"]).includes("fullscreen") && host.can("displayMode")) {
      host.requestDisplayMode("fullscreen").catch(() => {});
    }
  };
  document.addEventListener("keydown", (e) => {
    const n = e.altKey && !e.metaKey && !e.ctrlKey && /^Digit[1-9]$/.test(e.code || "") ? Number(e.code.slice(5)) : 0;
    const g = games();
    const t = state.route && shown(state.route.tab, g && g.open).flatMap(([, list]) => list)[n - 1];
    if (t && (t.home || (g && g.open)) && host.displayMode !== "pip") { e.preventDefault(); open(t); }  // beside the chat: the page shown stays
  });

  // A game's buttons for the editor, a play and an export (primary: the editor's is the main one).
  const projectActions = (g, { primary = false } = {}) => {
    const arg = { game: g.path }, busy = state.pending !== null;
    const lastLine = (out) => (out || "").trim().split("\n").filter(Boolean).pop() || "Exported.";
    return [
      el("button", { class: primary ? "primary" : undefined, disabled: busy, onclick: () => act("Opening the editor", "project_open_editor", arg, () => `${g.name} is open in the editor.`) }, "Open in editor"),
      el("button", { disabled: busy, onclick: () => act("Starting the game", "project_play", arg, () => `${g.name} is open in its own window: what you play is recorded.`) }, "Play"),
      el("button", { disabled: busy, onclick: () => act("Exporting", "project_export", arg, lastLine) }, "Export"),
    ];
  };

  // Buttons putting item ({ title, text, thumb, question }) in the person's
  // draft, here or in a new chat; a host without drafts sends the question.
  const askButtons = (item) => {
    if (!host.can("message")) return [];
    const ask = (target) => {
      const content = [host.text(item.text, { title: item.title })];
      if (item.thumb) content.push(host.image(item.thumb, { title: item.title }));
      host.message(content, { send: false, target, instead: item.question }).catch(() => {});
    };
    return [el("button", { title: "Put it in your message", onclick: () => ask("active") }, "Ask about it"),
      host.can("openai/message") ? el("button", { title: "Start a new chat about it", onclick: () => ask("new") }, "New chat") : null];
  };

  // A destructive action's button: the host's own confirm where it has one
  // (this page again, in its modal, which runs tool with args), else pressed
  // twice here (armed: pressed once; arm() marks that; go() does it).
  // after: what go() would do to the tab besides, once the modal is done.
  const confirmButton = ({ key, label, ask, tool, args, armed, arm, go, after }) => {
    const modal = host.can("modal");
    return el("button", { disabled: state.pending !== null, "data-key": "confirm:" + key, onclick: () => {
      if (armed) { go(); return; }  // asked here already
      if (!modal) { arm(); return; }
      // A host may answer as the modal opens or as it closes: the tab is read again on either, and on coming back.
      const done = () => { if (after) after(); return reread(); };
      state.modalDone = done;
      host.requestModal({ confirm: { label, ask, tool, args } }).then(done, () => { state.modalDone = null; arm(); });  // refused: asked here instead
    } }, armed ? ask : label);
  };
  // After a modal: what it did is read again, as after an action.
  const reread = () => refresh().catch(() => {}).then(() => { state.visit++; render(); });
  window.addEventListener("focus", () => { const done = state.modalDone; state.modalDone = null; if (done) done(); });  // back from the modal

  // The tools the modal's confirm may run: the destructive ones a tab asks about.
  const confirmable = new Set(["vcs_restore", "variant_merge", "variant_drop", "sandbox_drop", "file_delete"]);
  // This page as the host's modal: the question, then the tool run on yes.
  const confirmView = (c) => {
    const ok = c && typeof c.ask === "string" && confirmable.has(c.tool) && c.args && typeof c.args === "object";
    const close = () => host.close().catch(() => {});
    // confirmed: it ran (done once, whatever the host does after); pending: it's running (nothing to cancel then).
    const yes = async () => {
      state.pending = c.label; state.notice = c.label + "…"; render();
      let r;
      try { r = await host.callTool(c.tool, c.args); } catch (e) { r = { isError: true, content: [{ type: "text", text: String(e && e.message || e) }] }; }
      state.pending = null;
      state.confirmed = !(r && r.isError);
      state.notice = state.confirmed ? "Done." : `Couldn't: ${said(r) || "the call failed"}`;
      render();
      if (state.confirmed) close();
    };
    const busy = state.pending !== null;
    return el("div", { class: "view confirm" }, !ok ? [el("p", {}, "Nothing to confirm."), el("button", { onclick: close }, "Close")]
      : [el("h1", {}, c.ask), state.notice ? el("p", { class: "meta", role: "status" }, state.notice) : null,
         el("div", { class: "head" }, state.confirmed ? el("button", { onclick: close }, "Close")
           : [el("button", { class: "primary", disabled: busy, onclick: yes }, c.label), el("button", { disabled: busy, onclick: close }, "Cancel")])]);
  };

  const render = () => {
    if (host.modal) { kit.theme(host); document.getElementById("app").replaceChildren(confirmView(host.modal.confirm)); return; }
    if (routeFromHost()) return;  // follow rendered
    kit.theme(host);
    const focused = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-key");
    const app = document.getElementById("app");
    const g = games();
    if (!g) {
      app.replaceChildren(kit.empty(host.result ? said(host.result) || "This answer isn't Journeyman's." : "Opening Journeyman Studio…"));
      return;
    }
    if (state.cached && !g.cached) state.visit++;  // jm answered: tabs ask again, over reads made before
    state.cached = !!g.cached;
    openWanted(g);
    const game = g.games.find((x) => x.path === g.open) || (g.open ? { name: g.open.split(/[\\/]/).pop(), path: g.open, scenes: [] } : null);
    let { tab, params } = state.route;
    if (!tab.home && !game) tab = home;
    // A variant or sandbox opened to work in: the tools change it, not the game.
    const copy = game && game.copyOf ? { game: game.copyOf, kind: game.copyKind, name: game.copy } : null;  // jm says (games)
    const where = { studio: format({ tab, params }), game: game ? game.path : null, ...(copy ? { copyOf: copy.game, [copy.kind]: copy.name } : {}) };
    state.context = { text: `The person is in Journeyman Studio: ${tab.title}${game ? ` of ${game.name} (${game.path})` : ""}.` +
      (copy ? ` That's the ${copy.kind} ${copy.name} of the game at ${copy.game}: changes go to the ${copy.kind}, not the game.` : ""), data: where };
    const ctx = {
      host, kit, params, game, copy, games: g, go, act, current: tab.id, busy: state.pending !== null, visit: state.visit, nav: state.nav,
      call: (name, args) => host.callTool(name, args),
      say: (text) => { state.notice = text; render(); },
      has: (id) => tabs.some((t) => t.id === id),
      share: (text, data, attach) => { state.context = { text, data: { ...where, ...data }, attach }; },
      ask: (item) => askButtons(item),
      rerender: () => render(),
      projectActions, confirm: confirmButton,
      link: (id, p = {}) => format({ tab: tabs.find((t) => t.id === id) || home, params: p }),
    };
    if (game) for (const t of tabs) if (t.background) t.background(ctx);
    let body;
    try { body = tab.render(ctx); } catch (e) { console.error(e); body = kit.empty(`${tab.title} broke: ${e && e.message || e}`); }
    app.replaceChildren(
      el("nav", { class: "side" },
        el("div", { class: "brand" },
          el("svg:svg", { class: "mark", viewBox: "0 0 20 20", fill: "none", stroke: "currentColor", "stroke-width": "1.33", "aria-hidden": "true" },
            el("svg:circle", { cx: "10", cy: "10", r: "5.6" }), el("svg:path", { d: "M10 1.8 11.6 8.4 18.2 10 11.6 11.6 10 18.2 8.4 11.6 1.8 10 8.4 8.4Z" })),
          el("span", { class: "game-name", title: game ? game.path : "Journeyman Studio" }, game ? game.name : "Journeyman"),
          copy ? el("span", { class: "badge", title: `The ${copy.kind} ${copy.name}` }, copy.name) : null),
        tabBar(tab, game),
        el("div", { class: "status", role: "status", title: state.notice }, g.cached && !state.notice ? "Updating…" : state.notice)),
      el("div", { class: "main" },
        ...(host.outdated() ? [el("div", { class: "update", role: "note" },
          "This ChatGPT is older than Journeyman's pages need (26.928.20710): update it for forms, attachments and the file viewer.")] : []),
        // Beside the chat (picture-in-picture): no tabs; the way back is always here.
        host.displayMode === "pip" ? el("div", { class: "pipbar" }, el("span", { class: "meta" }, tab.title), el("span", { class: "spacer" }),
          el("button", { "data-key": "pip-back", onclick: () => host.requestDisplayMode((host.displayModes || []).includes("fullscreen") ? "fullscreen" : "inline").catch(() => {}) }, "Back to Studio")) : null,
        copy && host.displayMode !== "pip" ? el("div", { class: "copybar", role: "note" },
          kit.icon(copy.kind === "sandbox" ? "M6 2h4M6.5 2v4L3 13h10L9.5 6V2M5 10h6" : "M8 2v4M8 6l-4.5 4v4M8 6l4.5 4v4"),
          el("span", {}, `Working in ${copy.kind} `, el("b", {}, copy.name), `: changes go here, not to the game.`), el("span", { class: "spacer" }),
          el("button", { disabled: state.pending !== null, "data-key": "back-to-game", onclick: async () => {
            if (await act("Going back to the game", "open_game", { game: copy.game }, () => "Back in the game.")) go(format({ tab: tabs.find((t) => t.id === "variants") || tab, params: {} }));
          } }, "Back to the game")) : null,
        el("main", { class: "view" }, body)));
    if (focused) kit.focusKey(focused);
    share();
    if (host.displayMode === "inline") { try { host.notifyHeight(document.body.scrollHeight); } catch (e) {} }
  };

  host.onChange(render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  matchMedia("(max-width: 760px)").addEventListener("change", render);  // the tabs move between the side and the top
  render();
})();
</script>
</body>
</html>
