<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f6f7; --line: #e3e3e6; --text: #18181b; --muted: #6b6b75;
    --accent: #e8590c; --accent-soft: #fff1e8; --view: #101014; --shape: #4c6ef5; --prefab: #12b886;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #18181b; --panel: #222226; --line: #34343a; --text: #ececf0; --muted: #9a9aa5;
    --accent: #ff8a3d; --accent-soft: #3a2416;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { padding: 14px 16px; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .meta { color: var(--muted); }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
  @media (max-width: 700px) { .main { grid-template-columns: 1fr; } }
  .view { background: var(--view); border-radius: 10px; overflow: auto; align-self: start; max-height: 75vh; }
  .view svg { display: block; height: auto; }
  .left { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .drawn { max-width: 100%; border-radius: 10px; image-rendering: pixelated; } .drawn.none { padding: 20px 16px; }
  .asks button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .view .shape { fill: var(--shape); fill-opacity: .35; stroke: var(--shape); cursor: pointer; }
  .view .screen { fill: none; stroke: var(--muted); stroke-dasharray: 6 4; pointer-events: none; }
  .view .shape.prefab { fill: var(--prefab); stroke: var(--prefab); }
  .view .shape.on { fill: var(--accent); fill-opacity: .6; stroke: var(--accent); }
  .view .shape.drawn { fill: transparent; stroke-opacity: .45; } .view .shape.drawn.on { fill: var(--accent); fill-opacity: .25; stroke-opacity: 1; }
  .view .sprite { image-rendering: pixelated; pointer-events: none; }
  .side { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .list { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 6px;
    font: inherit; color: var(--text); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list button:hover { background: var(--panel); }
  .list button.on { background: var(--accent-soft); color: var(--accent); }
  .inspector { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .inspector h2 { font-size: 13px; margin: 0; }
  .asks { display: flex; gap: 6px; flex-wrap: wrap; }
  .asks button { font: inherit; font-weight: 500; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 4px 10px; min-height: 28px; cursor: pointer; }
  .asks button:hover { background: var(--panel); border-color: var(--muted); }
  .inspector h3 { font-size: 12px; font-weight: 600; color: var(--text); margin: 8px 0 0; }
  .field { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px; align-items: center; }
  .field label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .vals { display: flex; gap: 4px; min-width: 0; }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
    min-width: 0; width: 100%; }
  input[type="checkbox"] { width: auto; }
  pre { margin: 0; font-size: 11px; white-space: pre-wrap; word-break: break-word; color: var(--muted); max-height: 240px; overflow: auto; }
  .status { color: var(--muted); font-size: 12px; min-height: 16px; }
  .none { color: var(--muted); padding: 28px 16px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="none">Loading the scene…</div></div>
<script>/*__JM_BRIDGE__*/</script>
<script>
(() => {
  "use strict";
  const host = jmHost({ name: "journeyman-scene", version: "__JM_VERSION__", displayModes: ["fullscreen", "inline"] });
  const svgNS = "http://www.w3.org/2000/svg";
  const $ = (tag, attrs = {}, ...kids) => {
    const el = tag.startsWith("svg:") ? document.createElementNS(svgNS, tag.slice(4)) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.setAttribute("class", v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid.nodeType ? kid : String(kid));
    return el;
  };

  // laid: a scene_view answer this page asked for after a save, over the
  // host's. selected: an entity's where. shared: what the model has.
  // drawn: the engine's frame of the scene shown (scene_render), { of, src | "", error }; src "" while it
  // draws; of: the scene result it's of, so another shown since drops it.
  const state = { laid: null, selected: null, notice: "", shared: "", drawn: null };

  const data = () => {
    const out = state.laid && state.laid.over === host.result ? state.laid.result : host.result;
    const s = out && out.structuredContent;
    const said = out && Array.isArray(out.content) ? out.content.filter((c) => c && c.type === "text").map((c) => c.text).join(" ") : "";
    // How it looks: texture → its picture; a tile map's .tmj → { src, w, h }, drawn whole.
    const meta = out && out._meta || {}, looks = { sprites: meta["jm/sprites"] || {}, maps: meta["jm/maps"] || {} };
    return { loading: !out, scene: s && Array.isArray(s.entities) ? s : null, said, looks };
  };

  // The host-opened file: its JSON is what edits change.
  const opened = () => host.input && host.input.file && host.input.file.resourceUri;
  const doc = kit.jsonFile(host, { say: (notice) => { state.notice = notice; }, changed: () => render() });
  const editable = () => doc.editable(opened());

  // The entity at where ("entities[2].children[0]") in a scene document;
  // null for one that isn't in it (a prefab's child: "entities[2]/Shadow").
  const entryAt = (doc, where) => {
    if (!/^entities\[\d+\](\.children\[\d+\])*$/.test(where)) return null;
    let at = doc;
    for (const [, key, i] of where.matchAll(/(\w+)\[(\d+)\]/g)) at = at && Array.isArray(at[key]) ? at[key][Number(i)] : null;
    return at && typeof at === "object" ? at : null;
  };

  // The scene laid out again (after a save, or the file changed): what the model has is stale.
  const relayout = async () => {
    const over = host.result;
    const laid = await host.callTool("scene_view", { file: host.input.file });
    if (!laid || laid.isError || !laid.structuredContent) throw new Error(laid && laid.content && laid.content[0] && laid.content[0].text || "no scene");
    state.laid = { result: laid, over };
    state.shared = "";
  };

  // Changes one value of the selected entity and saves the file, unless it
  // changed since it was read (then it's read again and the change dropped).
  const change = (where, set) => doc.save((d) => set(entryAt(d, where)), async (outcome) => {
    if (outcome === "conflict") state.selected = null;  // where it was may be another entity now
    if (outcome !== "failed") await relayout();
  });

  const view = (s, { sprites, maps }) => {
    const es = s.entities;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    // Drawn y up, as the engine: a shape at (x, -y), turned the other way on screen.
    const turned = (e) => {
      const c = Math.abs(Math.cos(e.rotation || 0)), s = Math.abs(Math.sin(e.rotation || 0));
      return [(c * e.w + s * e.h) / 2, (s * e.w + c * e.h) / 2];
    };
    // A sprite's look: its picture (or a solid quad) and color; with a transform only, as the
    // engine draws it. Unscaled, the engine's quad is 2 × 2.
    const looks = new Map();
    for (const e of es) {
      const sp = e.components && e.components.SpriteComponent, t = e.components && e.components.TransformComponent;
      if (!sp || !t || (e.look && !sprites[e.look])) continue;  // look: what jm says it shows
      const c = [0, 1, 2, 3].map((i) => Array.isArray(sp.color) && typeof sp.color[i] === "number" ? sp.color[i] : 1);
      const unscaled = !Array.isArray(t.scale);
      looks.set(e, { src: e.look ? sprites[e.look] : "", c, w: unscaled ? 2 : e.w, h: unscaled ? 2 : e.h });
    }
    // A tile map stands on its transform (its bottom-left corner), y up.
    const tiled = es.filter((e) => e.components && e.components.TransformComponent && e.components.TileMapComponent)
      .map((e) => [e, maps[e.components.TileMapComponent.map]]).filter(([, m]) => m).sort(([a], [b]) => (a.z || 0) - (b.z || 0));
    for (const [e, m] of tiled) {
      x0 = Math.min(x0, e.x); x1 = Math.max(x1, e.x + m.w);
      y0 = Math.min(y0, -e.y - m.h); y1 = Math.max(y1, -e.y);
    }
    for (const e of es) {
      const look = looks.get(e), [hw, hh] = turned(look ? { ...e, w: look.w, h: look.h } : e);
      x0 = Math.min(x0, e.x - hw); x1 = Math.max(x1, e.x + hw);
      y0 = Math.min(y0, -e.y - hh); y1 = Math.max(y1, -e.y + hh);
    }
    // The screen as the game starts (scene_view's screen): the frame the layout is seen in.
    const sc = s.screen && s.screen.w > 0 && s.screen.h > 0 ? s.screen : null;
    if (sc) {
      x0 = Math.min(x0, sc.x - sc.w / 2); x1 = Math.max(x1, sc.x + sc.w / 2);
      y0 = Math.min(y0, -sc.y - sc.h / 2); y1 = Math.max(y1, -sc.y + sc.h / 2);
    }
    if (!es.length && !sc) { x0 = y0 = 0; x1 = y1 = 100; }
    // A camera entity's screen is fitted to the view (a long level scrolls on); without one a script may
    // move the camera anywhere, so the whole layout fits the view, unless it's over 3 screens wide.
    const fit = sc && (sc.camera || x1 - x0 > 3 * sc.w) ? sc : null;
    // The margin is the screen's (a long level's would push the screen out of the view).
    const m = (fit ? Math.max(fit.w, fit.h) : Math.max(x1 - x0, y1 - y0, 1)) * 0.04;
    const w = x1 - x0 + 2 * m, h = y1 - y0 + 2 * m;
    // A unit a pixel where it fits (a long level scrolls), down to 4000 × 1200 at most; with
    // the screen known, a screen's width (and its margin) fits the view and a level wider scrolls on.
    const k = Math.min(1, 4000 / w, 1200 / h);
    const width = fit ? `${Math.max(100, Math.round(w / (fit.w + 2 * m) * 100))}%` : sc ? "100%" : `max(100%, ${Math.round(w * k)}px)`;
    // A point's 4 px: in a screen fitted to the view, about 640 px across.
    const r = fit ? 4 * (fit.w + 2 * m) / 640 : sc ? 4 * w / 640 : 4 / k;  // fitted whole: the layout's width is the view's
    const svg = $("svg:svg", { viewBox: `${x0 - m} ${y0 - m} ${w} ${h}`, style: `width: ${width}` });
    for (const [e, m] of tiled) svg.append($("svg:image", { class: "sprite", href: m.src, x: e.x, y: -e.y - m.h, width: m.w, height: m.h, preserveAspectRatio: "none" }));
    // Each sprite as it looks (its picture tinted by its color, or a solid quad in it), lowest z first;
    // its box goes over it to pick.
    const tints = new Map(), defs = $("svg:defs");
    const tint = ([r, g, b]) => {
      const key = `${r} ${g} ${b}`;
      if (key === "1 1 1") return undefined;
      if (!tints.has(key)) {
        tints.set(key, `tint${tints.size}`);
        defs.append($("svg:filter", { id: tints.get(key), "color-interpolation-filters": "sRGB" },
          $("svg:feColorMatrix", { type: "matrix", values: `${r} 0 0 0 0 0 ${g} 0 0 0 0 0 ${b} 0 0 0 0 0 1 0` })));
      }
      return `url(#${tints.get(key)})`;
    };
    svg.append(defs);
    for (const [e, look] of [...looks].sort(([a], [b]) => (a.z || 0) - (b.z || 0))) {
      const at = { x: e.x - look.w / 2, y: -e.y - look.h / 2, width: look.w, height: look.h, opacity: look.c[3],
        transform: `rotate(${-(e.rotation || 0) * 180 / Math.PI} ${e.x} ${-e.y}) translate(${e.x} ${-e.y}) scale(${e.flipX ? -1 : 1} ${e.flipY ? -1 : 1}) translate(${-e.x} ${e.y})` };
      svg.append(look.src ? $("svg:image", { ...at, class: "sprite", href: look.src, preserveAspectRatio: "none", filter: tint(look.c) })
        : $("svg:rect", { ...at, class: "sprite", fill: `rgb(${look.c.slice(0, 3).map((v) => Math.round(v * 255)).join(" ")})` }));
    }
    // The screen over the pictures.
    if (sc) svg.append($("svg:rect", { class: "screen", x: sc.x - sc.w / 2, y: -sc.y - sc.h / 2, width: sc.w, height: sc.h, "vector-effect": "non-scaling-stroke" },
      $("svg:title", {}, sc.camera ? `The screen as the game starts (${sc.w}×${sc.h})` : `The screen before a script moves the camera (${sc.w}×${sc.h})`)));
    for (const e of es) {
      const cls = "shape" + (looks.has(e) ? " drawn" : "") + (e.prefab ? " prefab" : "") + (e.where === state.selected ? " on" : "");
      const pick = () => select(e.where);
      const shape = e.w > 0 && e.h > 0
        ? $("svg:rect", { class: cls, x: e.x - e.w / 2, y: -e.y - e.h / 2, width: e.w, height: e.h, "vector-effect": "non-scaling-stroke", onclick: pick,
            transform: e.rotation ? `rotate(${-e.rotation * 180 / Math.PI} ${e.x} ${-e.y})` : undefined })
        : $("svg:circle", { class: cls, cx: e.x, cy: -e.y, r, onclick: pick });
      shape.append($("svg:title", {}, e.name || e.where));
      svg.append(shape);
    }
    return $("div", { class: "view" }, svg);
  };

  // The scene as the engine draws it, beside its layout: one that's all UI or tiles shows here.
  const draw = async (s) => {
    const drawn = state.drawn = { of: s, src: "", error: "" };
    render();
    try {
      // A file the host opened is drawn in its own game, whichever is open.
      const r = await host.callTool("scene_render", host.input && host.input.file ? { file: host.input.file } : { scene: s.scene, game: s.game });
      const src = r && !r.isError && r._meta && r._meta["jm/image"];
      drawn.src = src || null;
      drawn.error = src ? "" : ((r && r.content) || []).filter((c) => c.type === "text").map((c) => c.text).join(" ") || "The engine drew nothing.";
    } catch (e) { drawn.src = null; drawn.error = String(e && e.message || e); }
    if (state.drawn === drawn) render();
  };
  const drawing = (s) => {
    const d = state.drawn && state.drawn.of === s ? state.drawn : null;
    if (!d) return null;
    if (d.src === "") return $("div", { class: "drawn none" }, "Drawing it in the engine…");
    return d.src ? $("img", { class: "drawn", src: d.src, alt: `${s.scene} as the engine draws it` }) : $("div", { class: "drawn none" }, d.error);
  };

  const list = (s) => $("div", { class: "list" }, s.entities.map((e) =>
    $("button", { class: e.where === state.selected ? "on" : "", title: e.where, onclick: () => select(e.where) },
      `${"  ".repeat((e.where.match(/children/g) || []).length)}${e.name || "(no name)"}`)));

  // A value's editor: numbers, text, switches, and lists of numbers; others shown.
  let fields = 0;
  const field = (label, value, set) => {
    const disabled = doc.saving;
    const id = `field${++fields}`;  // the label's (a vector's: its first value's, each value named by axis)
    const num = (v, put, attrs = { id }) => $("input", { type: "number", step: "any", value: String(v), disabled, ...attrs,
      onchange: (e) => { const n = Number(e.target.value); if (Number.isFinite(n)) put(n); } });
    let input;
    if (typeof value === "number") input = num(value, set);
    else if (typeof value === "string") input = $("input", { type: "text", id, value, disabled, onchange: (e) => set(e.target.value) });
    else if (typeof value === "boolean") input = $("input", { type: "checkbox", id, checked: value, disabled, onchange: (e) => set(!!e.target.checked) });
    else if (Array.isArray(value) && value.length && value.length <= 4 && value.every((v) => typeof v === "number")) {
      input = $("div", { class: "vals" }, value.map((v, i) => num(v, (n) => set(value.map((old, j) => (j === i ? n : old))),
        { id: i === 0 ? id : undefined, "aria-label": `${label} ${"xyzw"[i]}` })));
    } else input = $("pre", {}, JSON.stringify(value));
    return $("div", { class: "field" }, $("label", { title: label, for: id }, label), input);
  };

  const inspector = (s) => {
    const e = s.entities.find((x) => x.where === state.selected);
    if (!e) return $("div", { class: "inspector" }, $("span", { class: "meta" }, "Pick an entity to see it."));
    const kids = [$("h2", {}, e.name || "(no name)"), $("span", { class: "meta" }, e.prefab ? `${e.where} · ${e.prefab}` : e.where)];
    if (host.can("message")) {
      kids.push($("div", { class: "asks" }, $("button", { onclick: () => ask(s, e, "active") }, "Ask about this"),
        host.can("openai/message") ? $("button", { title: "A new chat about this entity", onclick: () => ask(s, e, "new") }, "New chat") : null));
    }
    const own = editable() && entryAt(doc.file.doc, e.where);
    if (own) {
      kids.push(field("name", own.name || "", (v) => change(e.where, (x) => { x.name = v; })));
      const key = own.prefab ? "overrides" : "components";
      for (const [c, values] of Object.entries(own[key] || {})) {
        kids.push($("h3", {}, c));
        for (const [k, v] of Object.entries(values || {})) {
          kids.push(field(k, v, (next) => change(e.where, (x) => { x[key][c][k] = next; })));
        }
      }
    }
    kids.push($("h3", {}, own ? "With its prefab" : "Components"), $("pre", {}, JSON.stringify(e.components, null, 1)));
    return $("div", { class: "inspector" }, kids);
  };

  const select = (where) => { state.selected = where; render(); };

  // The entity, said for the model: the picked one is an item in the person's chat.
  const said = (s, e) => `${e.name || e.where} (${e.where}) in ${s.scene}${s.gameName ? ` of ${s.gameName}` : ""}, at ${e.x}, ${e.y}: ` +
    JSON.stringify(e.components);
  const ask = (s, e, target) => host.message([host.text(said(s, e), { title: e.name || e.where })],
    { send: false, target, instead: `Let's look at ${e.name || e.where} in ${s.scene}.` }).catch(() => {});

  // What the page shows is the model's context, what "this" means next turn:
  // the entity picked, else the scene alone (a pick dropped is taken away).
  const sharePick = (s) => {
    const e = s.entities.find((x) => x.where === state.selected);
    const key = `${s.scene}:${e ? e.where : ""}`;
    if (key === state.shared) return;
    state.shared = key;
    const of = s.gameName ? ` of ${s.gameName}` : "";
    host.updateContext(e ? {
      content: [host.text(said(s, e), { title: e.name || e.where }),
        host.text(`The person is looking at ${e.name || e.where} (${e.where}) in ${s.scene}${of}.`, { hidden: true })],
      structuredContent: { scene: s.scene, entity: e.name, where: e.where, x: e.x, y: e.y, components: e.components },
    } : {
      content: [host.text(`The person is looking at the scene ${s.scene}${of}, no entity picked.`, { hidden: true })],
      structuredContent: { scene: s.scene },
    }).then((taken) => { if (!taken && state.shared === key) state.shared = ""; });
  };

  const status = (uri) => {
    if (host.outdated()) return "This ChatGPT is older than Journeyman's pages need (26.928.20710): update it to change scenes here.";
    if (editable()) return "";
    if (!uri || !host.can("openai/resource")) return "Read only here: open the file from your files in ChatGPT to change it.";
    return doc.file ? `Read only: ${doc.file.why}.` : "Reading the file…";
  };

  const render = () => {
    document.documentElement.dataset.theme = host.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const uri = opened();
    if (host.can("openai/resource")) doc.open(uri);
    const d = data();
    const app = document.getElementById("app");
    app.replaceChildren();
    if (d.loading) { app.append($("div", { class: "none" }, "Loading the scene…")); return; }
    if (!d.scene) { app.append($("div", { class: "none" }, d.said || "This answer isn't a scene.")); return; }
    const s = d.scene;
    const shown = !!state.drawn && state.drawn.of === s;
    app.append($("header", {}, $("h1", {}, s.name || s.scene), $("span", { class: "meta" }, `${s.scene}${s.gameName ? " · " + s.gameName : ""} · ${s.entities.length} ${s.entities.length === 1 ? "entity" : "entities"}`),
        host.can("callTool") ? $("span", { class: "asks" }, $("button", { "aria-pressed": String(shown), disabled: shown && state.drawn.src === "",
          onclick: () => shown ? (state.drawn = null, render()) : draw(s) }, "Rendered")) : null),
      $("div", { class: "status" }, state.notice || status(uri)),
      $("div", { class: "main" }, $("div", { class: "left" }, drawing(s), view(s, d.looks)), $("div", { class: "side" }, list(s), inspector(s))));
    sharePick(s);
    try { host.notifyHeight(document.body.scrollHeight); } catch (e) {}
  };

  host.onChange(render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
