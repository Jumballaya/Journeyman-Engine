# Builds the engine ("player") for each platform. `jm export --target <os-arch>`
# appends a game to one of these: download the artifacts into players/<target>/.
name: players

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  player:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, exe: journeyman_engine }
          - { os: windows-latest, target: windows-amd64, exe: journeyman_engine.exe }
          - { os: macos-latest, target: darwin-arm64, exe: journeyman_engine }
          - { os: macos-13, target: darwin-amd64, exe: journeyman_engine }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        run: |
          cmake --preset release -DJM_BUILD_EDITOR=OFF
          cmake --build --preset release --target journeyman_engine
      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.target }}
          path: build/release/engine/${{ matrix.exe }}
