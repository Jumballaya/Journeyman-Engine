# Every push to a branch, every pull request, and every release (release.yml
# runs this first): the C++ tests on each desktop OS (warnings are errors), the
# same tests under ASan/UBSan, and the CLI plus the demos built and
# script-tested with the jm this commit makes. A clean clone that doesn't
# build, or a test that only fails on GCC, turns this red.
name: tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]  # PR branches run through pull_request (once, not twice); tags are releases
  pull_request:
    branches: [master]

# A newer push to the same branch cancels the run it makes stale. Called from
# release.yml, github.workflow is "release": its own group, so pushes never
# cancel a release's tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  LINUX_PACKAGES: ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libgtk-3-dev

jobs:
  # A PR that only touches the site or docs skips the C++ and demo jobs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's files
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!site/**'
              - '!docs/**'
              - '!**/*.md'
          predicate-quantifier: every

  cpp:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages (GCC 13 is the default compiler)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.os }}
      - name: Configure
        shell: bash
        # MSVC's default /Zi debug info can't be cached; /Z7 (Embedded) can.
        run: cmake --preset tests -DJM_WARNINGS_AS_ERRORS=ON ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW' || '' }}
      - name: Build
        run: cmake --build --preset tests -- -k 0  # every error in one run, not just the first
      - name: Test
        run: ctest --preset tests
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: jm's file writes and setup follow Windows paths  # the other Go tests run on Linux
        if: runner.os == 'Windows'
        working-directory: cli
        shell: bash  # stops at the first failure; pwsh would only report the last
        run: |
          go test -v ./internal/atomicfile/
          go test -v -run Setup ./cmd/jm/

  sanitizers:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: asan
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0  # GLFW/GTK keep process-lifetime allocations
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset asan

  # Every demo, played twice from one replay on a virtual display with Mesa's
  # software GL: captured frames must match byte for byte.
  determinism:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    # The demos split across shards that run side by side; multiplayer runs on shard 0.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    # Games name no engine: jm finds this build's (and the server beside it).
    env:
      JM_ENGINE: ${{ github.workspace }}/build/release/engine/journeyman_engine
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES xvfb libgl1-mesa-dri libglx-mesa0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: determinism
      - name: This shard's demos
        run: |
          # One path per line: demo folders may have spaces ("Ash and Iron").
          i=0; : > "$RUNNER_TEMP/demos.txt"
          for demo in demos/*/; do
            [ -f "$demo/.jm.json" ] || continue
            [ $((i % 3)) = ${{ matrix.shard }} ] && printf '%s\n' "$demo" >> "$RUNNER_TEMP/demos.txt"
            i=$((i + 1))
          done
          cat "$RUNNER_TEMP/demos.txt"
      - name: Build the engine, the server and jm
        run: |
          cmake --preset release -DJM_BUILD_EDITOR=OFF
          cmake --build --preset release --target journeyman_engine journeyman_server
          (cd cli && go build -o "$RUNNER_TEMP/jm" ./cmd/jm)
      # Multiplayer demos are checked as sessions below: over a network, when
      # things arrive isn't repeatable.
      - name: Each demo draws the same frames twice
        run: |
          while IFS= read -r demo <&3; do
            [ -f "$demo/tests/multiplayer.json" ] && continue
            echo "::group::$demo"
            (cd "$demo" && "$RUNNER_TEMP/jm" build >/dev/null)
            xvfb-run -a -s "-screen 0 1280x1024x24" scripts/check-determinism.sh "$demo/build" scripts/determinism-replay.txt 60,600,1500
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/demos.txt"
      # Frames recorded on one machine (tests/golden) hold on another GPU.
      - name: Golden frames
        run: |
          while IFS= read -r demo <&3; do
            [ -d "$demo/tests/golden" ] || continue
            echo "::group::$demo"
            (cd "$demo" && xvfb-run -a -s "-screen 0 1280x1024x24" "$RUNNER_TEMP/jm" golden)
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/demos.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diffs-${{ matrix.shard }}
          path: demos/*/build/golden/
      # A driven run's recording (JM_DRIVE_RECORD) replays to the same state.
      - name: Each demo's driven run replays exactly
        run: |
          while IFS= read -r demo <&3; do
            [ -f "$demo/tests/multiplayer.json" ] && continue  # real-time net clock: not replayable
            scripts/check-drive-replay.sh "$demo/build"
          done 3< "$RUNNER_TEMP/demos.txt"
      # A recorded play (keys, clicks, uneven frame times, a marker) replays
      # the same, and jm plays gives the marker's state and image.
      - name: Each demo's recorded play is what jm plays shows
        run: |
          while IFS= read -r demo <&3; do
            [ -f "$demo/tests/multiplayer.json" ] && continue  # real-time net clock: not replayable
            xvfb-run -a -s "-screen 0 1280x1024x24" scripts/check-plays.sh "$demo" "$RUNNER_TEMP/jm"
          done 3< "$RUNNER_TEMP/demos.txt"
      # With no display or GL at all (JM_RENDERER=none) each demo runs without
      # an error and its state matches the GL run's.
      - name: Each demo runs the same with no GL
        run: |
          while IFS= read -r demo <&3; do
            [ -f "$demo/tests/multiplayer.json" ] && continue
            echo "::group::$demo"
            xvfb-run -a -s "-screen 0 1280x1024x24" scripts/check-null-renderer.sh "$demo/build" scripts/determinism-replay.txt 300,900,1500
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/demos.txt"
      # Each multiplayer demo played as a whole session on this machine (its
      # server, if it has one, and its games), no GL: every peer connected,
      # in the same scene, sharing the same entities.
      - name: Multiplayer demos play together
        if: matrix.shard == 0
        run: |
          for demo in demos/*/; do
            [ -f "$demo/tests/multiplayer.json" ] || continue
            echo "::group::$demo"
            (cd "$demo" && "$RUNNER_TEMP/jm" build >/dev/null)
            python3 scripts/check-multiplayer.py "$RUNNER_TEMP/jm" "$demo"
            echo "::endgroup::"
          done

  # install.ps1 in Windows PowerShell (what `irm | iex` runs in), on fake releases,
  # and the setup .exe.
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Upgrades, rollbacks and failure logs
        shell: powershell
        run: .\scripts\check-install-ps1.ps1
      - name: Inno Setup (for the setup .exe), if the image lacks it
        shell: powershell
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Stand-ins for the editor, engine and server: the setup only places them.
      - name: The setup installs, puts jm on PATH, and uninstalls
        shell: bash
        run: |
          v=v0.0.0-ci tmp="$(cygpath -u "$RUNNER_TEMP")" d="$tmp/setup-files"
          mkdir -p "$d" && cp LICENSE "$d/"
          (cd cli && go build -ldflags "-X main.version=$v" -o "$d/jm.exe" ./cmd/jm)
          for p in journeyman_editor journeyman_engine journeyman_server; do cp "$d/jm.exe" "$d/$p.exe"; done
          scripts/make-windows-setup.sh "$d" "$tmp/journeyman-setup.exe" "$v"
          scripts/check-windows-setup.sh "$tmp/journeyman-setup.exe" "$v"

  cli-and-demos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: go vet + go test
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
      - name: Build jm
        working-directory: cli
        run: go build -o "$RUNNER_TEMP/jm" ./cmd/jm
      # Compiles every demo's scripts against the runtime this jm embeds, and
      # runs the script tests the demos have.
      - name: Build and test the demos
        run: |
          for demo in demos/*/; do
            [ -f "$demo/.jm.json" ] || continue
            echo "::group::$demo"
            (cd "$demo" && "$RUNNER_TEMP/jm" fmt --check && "$RUNNER_TEMP/jm" build && { ! compgen -G "tests/*.spec.ts" >/dev/null || "$RUNNER_TEMP/jm" test; })
            echo "::endgroup::"
          done
      # The @jm/runtime and the demos' scripts against host doubles, with the
      # compiler jm builds them with.
      - name: Script runtime tests
        run: |
          export JM_ASC="$(cd demos/strike_wing && "$RUNNER_TEMP/jm" doctor --json | jq -r .toolchain.asc)"
          node --test cli/internal/stdlib/tests/*.test.mjs
      # The play timeline widget, run in a small DOM against the answers hosts give it.
      - name: Play timeline widget tests
        run: node --test cli/cmd/jm/widget/plays.test.cjs
      # The agent install guide the site serves, checked as text.
      - name: Site guide tests
        run: node --test site/agent-install.test.mjs
