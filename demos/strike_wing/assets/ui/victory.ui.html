<link rel="stylesheet" href="assets/ui/theme.css">
<style>
  #stats { margin-top: 24px; width: 320px; display: flex; flex-direction: column; gap: 14px; }
  #record { margin-top: 16px; font-size: 16px; color: #ffd34d; text-shadow: 2px 2px #b03a2e; }
  #credits { margin-top: 26px; }
  #prompt { margin-top: 20px; }
</style>
<div class="screen">
  <div class="heading" style="font-size: 32px">MISSION<br>COMPLETE</div>
  <div class="subheading">THE SKIES ARE FREE AGAIN</div>
  <div id="stats" class="panel">
    <div class="row"><span class="label">FINAL SCORE</span><span id="score" class="value">0000000</span></div>
    <div class="row"><span class="label">HI-SCORE</span><span id="hiscore" class="value gold">0000000</span></div>
  </div>
  <div id="record" class="hidden">NEW HIGH SCORE!</div>
  <div id="credits" class="hint">
    A JOURNEYMAN ENGINE DEMO<br>
    ART · KENNEY.NL (CC0)<br>
    FONT · PRESS START 2P (OFL)<br>
    MUSIC &amp; SOUND · SYNTHESIZED IN CODE<br>
    <span class="gold">THANK YOU FOR PLAYING!</span>
  </div>
  <div id="prompt" class="hint invisible">PRESS ENTER</div>
</div>
