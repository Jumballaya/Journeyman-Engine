<link rel="stylesheet" href="assets/ui/theme.css">
<style>
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 24px; display: flex; flex-direction: row;
         align-items: center; justify-content: space-between; padding: 0 12px; background-color: rgba(10, 12, 22, 0.85); }
  .score { font-size: 8px; width: 110px; }
  #time { font-size: 16px; color: #ffffff; width: 60px; text-align: center; }
  #winner { font-size: 32px; text-shadow: 3px 3px #10131f; }
</style>
<div id="bar">
  <div id="score0" class="score"></div>
  <div id="score1" class="score"></div>
  <div id="time"></div>
  <div id="score2" class="score"></div>
  <div id="score3" class="score"></div>
</div>
<div id="results" class="screen hidden">
  <div class="panel" style="display: flex; flex-direction: column; align-items: center; padding: 16px 24px">
    <div id="winner"></div>
    <div class="hint" style="margin-top: 10px">BACK TO THE LOBBY IN A MOMENT</div>
  </div>
</div>
