<link rel="stylesheet" href="assets/ui/theme.css">
<style>
  #board { position: absolute; left: 8px; top: 6px; display: flex; flex-direction: row; gap: 10px; }
  .row { font-size: 8px; }
  #armor { position: absolute; right: 10px; top: 6px; font-size: 8px; color: #ffffff; }
  #goal { position: absolute; right: 10px; bottom: 6px; font-size: 8px; color: #8f9cc4; }
  #feed { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 8px; color: #ffffff; }
  #winner { font-size: 32px; text-shadow: 3px 3px #10131f; }
</style>
<div id="board">
  <div id="row0" class="row"></div><div id="row1" class="row"></div><div id="row2" class="row"></div><div id="row3" class="row"></div>
  <div id="row4" class="row"></div><div id="row5" class="row"></div><div id="row6" class="row"></div><div id="row7" class="row"></div>
</div>
<div id="armor"></div>
<div id="goal"></div>
<div id="feed" class="hidden"></div>
<div id="over" class="screen hidden">
  <div class="panel" style="display: flex; flex-direction: column; align-items: center; padding: 16px 24px">
    <div id="winner"></div>
    <div class="hint" style="margin-top: 10px">A NEW MATCH STARTS IN A MOMENT</div>
  </div>
</div>
